name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - name: Run markdownlint
        run: npx --yes markdownlint-cli2 "**/*.md"

      - name: Validate relative links with lychee (offline mode)
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --offline --no-progress '**/*.md'
          fail: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Verify clean-slate benchmark sha256 manifest
        run: python papers/AI-Engineering/clean-slate-specialist-context/supporting/benchmark/verify_sha256_manifest.py

      - name: Verify context-efficiency benchmark sha256 manifests
        run: |
          python papers/AI-Engineering/context-efficiency-methods/supporting/benchmark/verify_sha256_manifest.py
          python papers/AI-Engineering/context-efficiency-methods/supporting/benchmark/verify_sha256_manifest.py --manifest tooling-suite-sha256-manifest.json

      - name: Verify evidence traceability matrix
        run: python scripts/verify_traceability.py
