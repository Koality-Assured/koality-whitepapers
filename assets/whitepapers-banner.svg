    <rect x="23" y="11" width="242" height="174" rx="8" fill="#fffdf8" stroke="#dbe8df" stroke-width="2"/>
    <path d="M53 50h176M53 68h148M53 86h164M53 104h121" stroke="#6c9287" stroke-width="5" stroke-linecap="round"/>
    <path d="M53 132h78" stroke="#173f46" stroke-opacity=".35" stroke-width="5" stroke-linecap="round"/>
    <rect x="174" y="119" width="55" height="42" rx="7" fill="#f2d59d"/>
