    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0v36" fill="none" stroke="#c7ddd1" stroke-opacity=".10" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="260" rx="22" fill="url(#field)"/>
  <rect width="1200" height="260" rx="22" fill="url(#grid)"/>
  <path d="M0 216c180-54 300 49 490-4s326-52 496 2 163 22 214 4v42H0Z" fill="#102f36" fill-opacity=".32"/>
  <circle cx="1060" cy="56" r="112" fill="#e6aa4b" fill-opacity=".13"/>
  <g transform="translate(810 34) rotate(5 150 100)">
