  <text x="86" y="124" fill="#fffdf8" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="700">Clear questions.</text>
  <text x="86" y="166" fill="#fffdf8" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="700">Traceable evidence.</text>
