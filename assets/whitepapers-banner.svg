<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
  <title id="title">Koality-Assured white-paper series</title>
  <desc id="desc">A quiet editorial banner with a layered paper folio, source lines, and a highlighted evidence marker.</desc>
  <defs>
    <linearGradient id="field" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#173f46"/>
