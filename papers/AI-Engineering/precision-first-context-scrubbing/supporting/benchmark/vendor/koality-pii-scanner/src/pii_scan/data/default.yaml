    pattern: '(?i)(?:fingerprint_?(?:hash|data|template|scan)|face_?(?:id|template|hash|embedding)|voiceprint|iris_?(?:scan|hash|data)|retinal_?(?:scan|data)|gait_?(?:pattern|data))["\s:=,]+'
