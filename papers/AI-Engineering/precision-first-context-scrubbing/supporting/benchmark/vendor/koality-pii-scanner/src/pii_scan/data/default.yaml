  # ── Gaming personalization ────────────────────────────────────────────────────
  # Data categories collected for matchmaking, anti-cheat, and personalization
  # engines. Personal data under GDPR Art. 4(1) / CCPA when linked to an account.
  # Art. 22 may apply if used for automated decisions (bans, matchmaking gates).

  - id: hwid-context
    description: Hardware fingerprint / HWID in anti-cheat or device-tracking context
    pattern: '(?i)(?:hwid|hardware_?(?:id|fingerprint|hash|ban)|machine_?id|device_?fingerprint|bios_?(?:id|serial)|disk_?(?:serial|uuid))["\s:=,]+["\x27]?[A-Za-z0-9_\-]{16,}["\x27]?'
    confidence: high
    severity: high
    category: gaming-personalization
    cwe: ["CWE-359"]
    summary: Hardware fingerprint / HWID detected in source or config
    remediation: "Do not hardcode hardware identifiers in source. HWIDs collected by anti-cheat systems are personal data under GDPR Recital 30 and EDPB Guidelines 01/2025. HWID ban records likely trigger GDPR Art. 22 (automated decision with significant effect)."

  - id: session-token-context
    description: Session token or session ID in variable context
    pattern: '(?i)(?:session_?(?:id|token|key|hash)|sessionid|session_?secret)["\s:=,]+["\x27][A-Za-z0-9_\-]{16,}["\x27]'
    confidence: high
    severity: high
    category: gaming-personalization
    cwe: ["CWE-798"]
    summary: Session token or ID detected in variable context
    remediation: "Remove hardcoded session tokens from source. Session tokens are bearer credentials granting access to the user's session. Rotate immediately."

  - id: matchmaking-rating
    description: Player matchmaking rating / ELO / skill score in variable context
    pattern: '(?i)(?:mmr|elo|skill_?rating|matchmaking_?rating|rank_?score|trueskill|mu_?sigma|conserv(?:ative)?_?rating)["\s:=,]+[0-9]{1,6}(?:\.[0-9]+)?'
    confidence: medium
    severity: low
    category: gaming-personalization
    cwe: ["CWE-359"]
    summary: Player matchmaking rating / ELO detected in variable context
    remediation: "Skill ratings are personal data under GDPR Art. 4(1) (CJEU Nowak). Do not expose raw MMR/ELO values in client-accessible code or static assets. Art. 22 may apply if matchmaking ratings drive automated access decisions."

  - id: in-game-currency-balance
    description: In-game currency balance in variable context
    pattern: '(?i)(?:v_?bucks?|vbucks?|gems?_?(?:balance|amount|count)|credits?_?(?:balance|amount)|coins?_?(?:balance|amount)|gold_?(?:balance|amount)|in_?game_?currency)["\s:=,]+[0-9]{1,8}'
    confidence: medium
    severity: low
    category: gaming-personalization
    cwe: ["CWE-359"]
    summary: In-game currency balance detected in variable context
    remediation: "In-game currency balances linked to an account are personal data under GDPR Art. 4(1) and purchase history under CCPA. Do not hardcode real player balances in source code."

  # ── GDPR Article 9 special categories ────────────────────────────────────────
  # Special category data under GDPR Art. 9 requires explicit consent (Art. 9(2)(a))
  # or another specific exception. Processing without a valid Art. 9 basis is
  # unlawful regardless of any Art. 6 lawful basis. Highest enforcement risk.

  - id: health-data-context
    description: Health or medical data in variable context (GDPR Art. 9 special category)
    pattern: '(?i)(?:diagnosis|medical_?condition|health_?(?:status|condition|data|record)|prescription_?(?:data|history|drug)|treatment_?(?:plan|history|record)|disability_?(?:status|type))["\s:=,]+["\x27][^"'']{3,}["\x27]'
    confidence: medium
    severity: critical
    category: pii
    cwe: ["CWE-359"]
    summary: Health or medical data detected in variable context (GDPR Art. 9 special category)
    remediation: "Health data is a GDPR Art. 9 special category requiring explicit consent or a specific Art. 9(2) exception. Remove from source code immediately. Store in an encrypted, access-controlled system with full audit logging."

  - id: biometric-data-context
