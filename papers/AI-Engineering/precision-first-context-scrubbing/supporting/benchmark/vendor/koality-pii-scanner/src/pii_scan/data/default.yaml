    severity: medium
    category: pii
    cwe: ["CWE-359"]
    summary: GPS longitude coordinate detected
    remediation: "GPS coordinates are personal data under GDPR Art. 4(1) and SPI under CPRA. Avoid hardcoding real coordinates in source code."

