    summary: Biometric identifier detected in variable context (GDPR Art. 9 special category)
    remediation: "Biometric data is a GDPR Art. 9 special category and CCPA Sensitive Personal Information. Explicit consent required. Remove from source. COPPA 2025 amendments explicitly added biometric identifiers to COPPA personal information."

  - id: gender-identity-context
